<html>
    <head>
        <title>My superhero Card</title>
        <style>

            /* Typography - font, size, weight, colour for the whole page */
            body{
                background-color:darkblue;
                color:white;
                font-family:Arial, sans-serif;
            }
            /* Typography + Text Shadow - big bold with an orange shadow */

            .hero-name {
                font-size: 60px;
                font-weight:bold;
                color:yellow;
                text-shadow:3px 3px orange;

            }

            /* Typography + Text trnsform - tagline becomes title case */
            .tagline {
                font-style:italic;
                color-lightblue;
                text-transform:capitalize;

            }

            /* Text transform + text decoration - section headings in CAPS with underline */
            .label {
                text-transform: uppercase;
                text-decoration:underline;
                color:coral;
            }

            /* Typography - powers stand out in bold green */
            .power {
                font-weight:bold;
                color:lightgreen;
            }

            /* Text decoration - weaknesses are crossed out */
            .weakness{
                text-decoration:line-through;
                color:gray;
            } 

            /* Transform - the badge is titles to the side */
            .badge {
                font-size:28xp;
                font-weight:bold;
            }

            /* typography-footer text */
            .made-by{
                color:coral;
                font-style:italic;
            }
        

        </style>

    </head>
    <body>
        <h1 class="hero-name">Thunder Kid</h1>
        <p class="tagline">The most powerfull hero in the school</p>

        <h2 class="label">super powers</h2>
        <p class="power">Can run faster than a cheetah</p>
        <p class="power">can lift a school bus</p>

        <h2 class="label">weaknesses</h2>
        <p class="weakness">maths homework</p>
        <p class="weakness">brocoli</p>

        <p class="badge">Top Hero</p>

        <p class="made-by">created by ____________</p>
    </body>
</html>
