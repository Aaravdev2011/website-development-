<html>
    <head>
        <title>My Animal Fact File</title>
        <style>

            /* Page background - sets the color and font for the whole page */
            body {
                background-color: darkgreen;
                font-family: Arial, sans-serif;
            }

            /* Box Model - width sets the content area 
            padding pushes the text away from the edges
            border draws a isible frame around the fact file 
            margin pushes the fact file away from the sreen edge */
            .fact-file {
                background-color: lightyellow;
                color: darkslategray;
                width: 260px;
                padding:25px;
                border: 4px solid forestgreen;
                margin: 30px;
            }

            /* Animal name - forestgreen so it stands out */
            .animal-name {
                color:darkslategray;
            }
            /* cool fact - orange and italic to make it feel special */
            .cool-fact {
                color:darkorange;
                font-style:italic;
            }
            .animal-class {
                background-color:white;
                font-size:16px;
                color:blue;

            }

   

        </style>
    </head>
    <body>
        <div class="fact-file">
            <h2 class="animal-name">Snow leopard</h2>
            <p class="detail">big cat</p>
            <p class="detail">lives in: mountain ranges of central asia</p>
            <p class="detail">diet: deer, goats, and wild sheep</p>
            <p class="cool-fact">cool fact: can leap up to 15 meters in one jump !</p>
            <p class="animal-class">cheetah is the fastest animal</p>
        </div>
    </body>
</html>
